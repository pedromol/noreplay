apiVersion: apps/v1
kind: Deployment
metadata:
  name: noreplay
  labels:
    app: noreplay
spec:
  # SQLite on a ReadWriteOnce volume cannot be shared by two pods; horizontal
  # scaling is out of scope for the MVP.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: noreplay
  template:
    metadata:
      labels:
        app: noreplay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: server
          image: noreplay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: noreplay-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: noreplay-data
        - name: tmp
          emptyDir: {}
---
# EXAMPLE ConfigMap — copy to configmap.yaml, edit, and apply.
# Keys are exactly the ones the server reads (cmd/server/main.go).
# No secret values belong in this file (KTD8); the allowlist e-mail is
# configuration, not a secret, and signup fails closed when SIGNUP_EMAIL is
# absent or empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: noreplay-config
  labels:
    app: noreplay
data:
  ADDR: ":8080"
  DATABASE_PATH: "/data/noreplay.db"
  # Single allowlist e-mail for signup (case/space-insensitive comparison).
  # Remove or leave empty to disable signup entirely.
  SIGNUP_EMAIL: "you@example.com"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noreplay
  labels:
    app: noreplay
  annotations:
    # TLS is a hard prerequisite (R12/KTD4): the bearer token must never travel
    # in clear. Redirect all plain-HTTP requests to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  # Cluster-specific: adjust to your ingress controller (nginx, traefik, ...).
  ingressClassName: nginx
  tls:
    # Certificate comes from a TLS Secret (created out of band, e.g. with
    # cert-manager). Only the Secret NAME is referenced here — no certificate
    # data ever lives in a versioned manifest (KTD8).
    - hosts:
        - noreplay.example.com
      secretName: noreplay-tls
  rules:
    - host: noreplay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: noreplay
                port:
                  number: 8080
---
# PersistentVolumeClaim for the SQLite database (R12): state lives outside the
# container, so image rebuilds and pod restarts never lose data.
# storageClassName is intentionally omitted -> the cluster's default StorageClass
# is used. The class (hostPath, local-path, EBS, ...) is cluster-specific; set it
# explicitly if your cluster has more than one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: noreplay-data
  labels:
    app: noreplay
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: noreplay
  labels:
    app: noreplay
spec:
  type: ClusterIP
  selector:
    app: noreplay
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---