<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 24px auto;
        max-width: 540px;
        color: #202124;
        background: #f8f9fa;
        line-height: 1.5;
        padding: 0 16px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.6em;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .badge-offline {
        display: inline-block;
        background: #e6f4ea;
        color: #137333;
        font-weight: 600;
        font-size: 0.55em;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #ceead6;
        vertical-align: middle;
      }
      .card {
        margin-bottom: 16px;
        padding: 16px 20px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.15em;
        color: #202124;
        margin-bottom: 12px;
      }
      .description {
        font-size: 0.9em;
        color: #5f6368;
        margin-top: 0;
        margin-bottom: 12px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .stat-item {
        background: #f1f3f4;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }
      .stat-value {
        font-size: 1.6em;
        font-weight: 700;
        color: #1a73e8;
      }
      .stat-label {
        font-size: 0.85em;
        color: #5f6368;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.9em;
        font-weight: 500;
      }
      input[type="text"], input[type="email"], input[type="password"], select {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 0.95em;
      }
      input:focus, select:focus {
        border-color: #1a73e8;
        outline: none;
      }
      button {
        padding: 8px 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #ffffff;
        color: #3c4043;
        font-size: 0.9em;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      button:hover {
        background: #f1f3f4;
        border-color: #c6c9cc;
      }
      button.primary {
        background: #1a73e8;
        color: #ffffff;
        border-color: #1a73e8;
      }
      button.primary:hover {
        background: #1765cc;
      }
      button.danger {
        background: #fff;
        color: #d93025;
        border-color: #f28b82;
      }
      button.danger:hover {
        background: #fce8e6;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .status {
        margin-top: 8px;
        min-height: 1.2em;
        font-size: 0.85em;
        color: #3c4043;
      }
      .hidden {
        display: none !important;
      }
      .file-input {
        display: none;
      }
      .file-label,
      label.file-label.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #ffffff;
        color: #3c4043;
        font-size: 0.9em;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
        margin-bottom: 0;
      }
      .file-label:hover,
      label.file-label.button:hover {
        background: #f1f3f4;
        border-color: #c6c9cc;
      }
      details {
        margin-bottom: 16px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 14px 18px;
        background: #ffffff;
      }
      summary {
        font-weight: 600;
        cursor: pointer;
        font-size: 1.05em;
        color: #202124;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <span data-i18n="options_title"></span>
      </h1>
      <p class="description" data-i18n="options_description"></p>
    </header>

    <section class="card">
      <h2 data-i18n="catalog_title"></h2>
      <p class="description" data-i18n="catalog_description"></p>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value" id="stat-watched">-</div>
          <div class="stat-label" data-i18n="stat_watched"></div>
        </div>
        <div class="stat-item">
          <div id="stat-never-skip" class="stat-value">0</div>
          <div class="stat-label" data-i18n="stat_never_skip"></div>
        </div>
      </div>
      <div class="btn-group">
        <button id="export-catalog" data-i18n="catalog_export_btn"></button>
        <label for="import-catalog-file" class="file-label button" role="button" tabindex="0" data-i18n="catalog_import_btn"></label>
        <input id="import-catalog-file" class="file-input" type="file" accept="application/json" />
        <button id="clear-catalog" class="danger" data-i18n="catalog_clear_btn"></button>
      </div>
      <div id="catalog-feedback" class="status"></div>
    </section>

    <section class="card">
      <h2 data-i18n="sync_title"></h2>
      <p class="description" data-i18n="sync_description"></p>
    </section>

    <section class="card">
      <h2 data-i18n="history_import_title"></h2>
      <p class="description" data-i18n="history_import_description"></p>
      <div class="btn-group">
        <button id="start-history-import" data-i18n="history_import_start_btn"></button>
      </div>
      <div id="history-import-feedback" class="status"></div>
    </section>

    <details>
      <summary data-i18n="hide_watched_title"></summary>
      <div style="margin-top: 12px;">
        <p class="description" data-i18n="hide_watched_description"></p>
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
          <input type="checkbox" id="hide-watched-toggle" style="width: auto; margin: 0;" />
          <span data-i18n="hide_watched_toggle_label"></span>
        </label>
        <div id="hide-watched-feedback" class="status"></div>
      </div>
    </details>

    <script type="module" src="options.js"></script>
  </body>
</html>
