<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 24px auto;
        max-width: 540px;
        color: #202124;
        background: #f8f9fa;
        line-height: 1.5;
        padding: 0 16px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.6em;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .badge-offline {
        display: inline-block;
        background: #e6f4ea;
        color: #137333;
        font-weight: 600;
        font-size: 0.55em;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid #ceead6;
        vertical-align: middle;
      }
      .card {
        margin-bottom: 16px;
        padding: 16px 20px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(60, 64, 67, 0.05);
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.15em;
        color: #202124;
        margin-bottom: 12px;
      }
      .description {
        font-size: 0.9em;
        color: #5f6368;
        margin-top: 0;
        margin-bottom: 12px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .stat-item {
        background: #f1f3f4;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }
      .stat-value {
        font-size: 1.6em;
        font-weight: 700;
        color: #1a73e8;
      }
      .stat-label {
        font-size: 0.85em;
        color: #5f6368;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.9em;
        font-weight: 500;
      }
      input[type="text"], input[type="email"], input[type="password"], select {
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 0.95em;
      }
      input:focus, select:focus {
        border-color: #1a73e8;
        outline: none;
      }
      button {
        padding: 8px 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #ffffff;
        color: #3c4043;
        font-size: 0.9em;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      button:hover {
        background: #f1f3f4;
        border-color: #c6c9cc;
      }
      button.primary {
        background: #1a73e8;
        color: #ffffff;
        border-color: #1a73e8;
      }
      button.primary:hover {
        background: #1765cc;
      }
      button.danger {
        background: #fff;
        color: #d93025;
        border-color: #f28b82;
      }
      button.danger:hover {
        background: #fce8e6;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status {
        margin-top: 8px;
        min-height: 1.2em;
        font-size: 0.85em;
        color: #3c4043;
      }
      .hidden {
        display: none !important;
      }
      details {
        margin-top: 16px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 14px 18px;
        background: #ffffff;
      }
      summary {
        font-weight: 600;
        cursor: pointer;
        font-size: 1.05em;
        color: #202124;
      }
      summary:focus {
        outline: none;
      }
      .sync-section {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #eee;
      }
      .sync-section form {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 6px;
      }
      .sync-section h3 {
        margin-top: 0;
        font-size: 1em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span data-i18n="extension_name"></span> <span class="badge-offline" data-i18n="badge_offline"></span></h1>
      <p class="description" data-i18n="offline_description"></p>
    </header>

    <div class="card" id="catalog-card">
      <h2 data-i18n="catalog_local_title"></h2>
      <p class="description" data-i18n="catalog_local_description"></p>
      <div class="stats-grid">
        <div class="stat-item">
          <div id="stat-watched" class="stat-value">0</div>
          <div class="stat-label" data-i18n="stat_watched"></div>
        </div>
        <div class="stat-item">
          <div id="stat-never-skip" class="stat-value">0</div>
          <div class="stat-label" data-i18n="stat_never_skip"></div>
        </div>
      </div>
      <div class="btn-group">
        <button id="catalog-export-btn" type="button" data-i18n="catalog_export_btn"></button>
        <button id="catalog-import-trigger-btn" type="button" data-i18n="catalog_import_btn"></button>
        <input id="catalog-import-input" type="file" accept=".json,application/json" class="hidden" />
        <button id="catalog-clear-btn" type="button" class="danger" data-i18n="catalog_clear_btn"></button>
      </div>
      <div id="catalog-feedback" class="status"></div>
    </div>

    <form id="preferences-form" class="card">
      <h2 data-i18n="preferences_title"></h2>
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: normal;">
        <input id="setting-hide-watched" type="checkbox" style="width: auto; margin-bottom: 0;" />
        <span data-i18n="preferences_hide_watched"></span>
      </label>
      <div id="preferences-feedback" class="status"></div>
    </form>

    <form id="history-import-form" class="card">
      <h2 data-i18n="history_import_title"></h2>
      <p class="description" data-i18n="history_import_description"></p>
      <label for="history-target" data-i18n="history_import_quantity"></label>
      <select id="history-target">
        <option value="50" data-i18n="history_import_last_50"></option>
        <option value="100" selected data-i18n="history_import_last_100"></option>
        <option value="200" data-i18n="history_import_last_200"></option>
        <option value="0" data-i18n="history_import_all_until_stop"></option>
      </select>
      <button id="history-import-btn" type="submit" class="primary" data-i18n="history_import_btn"></button>
      <div id="history-import-feedback" class="status"></div>
    </form>

    <details id="cloud-sync-details">
      <summary data-i18n="cloud_sync_title"></summary>
      <div class="sync-section">
        <p class="description" data-i18n="cloud_sync_description"></p>

        <form id="server-config-form">
          <h3 data-i18n="sync_server_title"></h3>
          <label for="server-url" data-i18n="sync_server_url_label"></label>
          <div style="display: flex; gap: 8px;">
            <input id="server-url" type="text" placeholder="https://noreplay.local" />
            <button id="server-url-btn" type="submit" style="white-space: nowrap;" data-i18n="sync_server_url_save"></button>
          </div>
          <div id="server-url-feedback" class="status"></div>
        </form>

        <div id="session-status" class="status" style="font-weight: 500; margin: 12px 0;" data-i18n="session_checking"></div>

        <form id="signup-form" novalidate>
          <h3 data-i18n="signup_title"></h3>
          <label>
            <span data-i18n="signup_email_label"></span>
            <input id="signup-email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span data-i18n="signup_password_label"></span>
            <input id="signup-password" type="password" autocomplete="new-password" minlength="12" required />
          </label>
          <button type="submit" data-i18n="signup_btn"></button>
          <div id="signup-feedback" class="status"></div>
        </form>

        <form id="login-form" novalidate>
          <h3 data-i18n="login_title"></h3>
          <label>
            <span data-i18n="login_email_label"></span>
            <input id="login-email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span data-i18n="login_password_label"></span>
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" data-i18n="login_btn"></button>
          <div id="login-feedback" class="status"></div>
        </form>

        <form id="logout-form" class="hidden">
          <h3 data-i18n="active_session_title"></h3>
          <button type="submit" data-i18n="logout_btn"></button>
          <div id="logout-feedback" class="status"></div>
        </form>
      </div>
    </details>

    <script src="i18n-polyfill.js"></script>
    <script type="module" src="options.js"></script>
  </body>
</html>
